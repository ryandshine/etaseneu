# --- Rate limit zones (konteks http; conf.d/*.conf di-include nginx di http) ---
limit_req_zone $binary_remote_addr zone=eta_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=eta_heavy:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=eta_api:10m   rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (Batch A hardening) ---
    # Catatan: nginx MENGGANTI (bukan menggabung) add_header saat sebuah
    # location punya add_header sendiri -- karena itu set non-CSP diulang di
    # `location /api/layers` dan `location ~* \.(...)$` di bawah. CSP hanya
    # relevan untuk dokumen HTML (disajikan lewat `location /`), jadi tidak
    # perlu diulang di sana.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP: Report-Only dulu -- pelanggaran hanya muncul di console browser,
    # fitur (peta Leaflet, Turnstile, overlay cuaca/angin) TIDAK rusak.
    # Setelah console bersih, ganti nama header ini jadi
    # Content-Security-Policy untuk enforce.
    set $eta_csp "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'";
    add_header Content-Security-Policy-Report-Only $eta_csp always;

    # Di belakang Traefik: tanpa ini $binary_remote_addr = IP Traefik, jadi
    # SEMUA user berbagi satu kuota rate limit.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Tanpa direktif ini nginx memakai default 1 MB, sehingga unggahan apa pun
    # yang lebih besar ditolak 413 sebelum sampai ke aplikasi -- termasuk berkas
    # GeoJSON batas wilayah yang wajarnya belasan sampai ratusan MB.
    #
    # Batas dasar 55 MB dipasang di level server, bukan 500 MB, karena ada
    # endpoint publik (/api/point-match/analyze) yang boleh diakses siapa saja.
    # nginx menampung seluruh badan permintaan lebih dulu sebelum aplikasi
    # sempat menolaknya, jadi batas longgar di sini berarti siapa pun bisa
    # memaksa server menelan ratusan MB per permintaan. Aplikasi sendiri
    # membatasi endpoint itu di 50 MB.
    client_max_body_size 55m;
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain application/xml;
    gzip_min_length 1024;

    location = /api {
        proxy_pass http://api:8000/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/layers {
        proxy_pass http://api:8000/api/layers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Cache pendek: /api/layers sekarang ringan (cuma 2 layer KPS/Adat).
        # Sebelumnya 1 jam + stale-while-revalidate 24 jam -- itu bikin daftar
        # layer basi (mis. layer yang sudah dihapus) nyangkut lama di browser/CDN.
        add_header Cache-Control "public, max-age=120";
        add_header CDN-Cache-Control "public, max-age=120";
        add_header Vary "Accept-Encoding";
        # Diulang: add_header di location ini mengganti warisan dari server.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Unggah dataset batas wilayah: hanya bisa dipakai admin (dilindungi
    # X-Admin-Key di aplikasi), dan berkasnya memang besar -- PS_FEB_26 saja
    # 192 MB. Batasnya disamakan dengan yang sudah dijanjikan UI (500 MB),
    # supaya keterangan di layar tidak lagi bertentangan dengan kenyataan.
    location /api/geojson/upload {
        proxy_pass http://api:8000/api/geojson/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500m;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        # Sinkronisasi setelah unggah membaca ulang seluruh berkas layer yang
        # ada (PS_FEB_26 sendiri 192 MB), jadi jendelanya dilonggarkan supaya
        # permintaan tidak putus di tengah proses.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /api/auth/login {
        limit_req zone=eta_login burst=5 nodelay;
        proxy_pass http://api:8000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /api/point-match/analyze {
        limit_req zone=eta_heavy burst=2;
        client_max_body_size 55m;
        proxy_pass http://api:8000/api/point-match/analyze;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api/land-cover/analyze {
        limit_req zone=eta_heavy burst=2;
        proxy_pass http://api:8000/api/land-cover/analyze;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/export {
        limit_req zone=eta_heavy burst=3;
        proxy_pass http://api:8000/api/export;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        limit_req zone=eta_api burst=40 nodelay;
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Shell SPA JANGAN di-cache: tanpa ini `index.html` (dan header-nya, mis.
    # Permissions-Policy / CSP) tersimpan di cache heuristik browser dan
    # perubahan header baru terlihat berhari-hari kemudian. `no-cache` tetap
    # mengizinkan revalidasi kondisional, jadi murah. Berkas aset ber-hash di
    # bawah tetap `immutable`.
    #
    # add_header di location ini MENGGANTI warisan dari server -- jadi seluruh
    # header keamanan + CSP diulang di sini.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy-Report-Only $eta_csp always;
    }

    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }
}

