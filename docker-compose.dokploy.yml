services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.dokploy
    environment:
      # Var berikut diisi dari tab Environment stack Dokploy (BUKAN
      # .env.dokploy -- interpolasi kosong di sini akan menimpa nilai
      # env_file).
      # TURNSTILE_SECRET_KEY kosong = verifikasi captcha login dilewati.
      # API_REQUIRE_AUTH false/kosong = endpoint baca API publik (perilaku
      # lama); true = butuh Authorization: Bearer <jwt>.
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      API_REQUIRE_AUTH: ${API_REQUIRE_AUTH:-false}
    volumes:
      - ${HOST_SHP_DIR:-/etc/dokploy/data/etaseneu/shp}:/app/shp:ro
      - ${HOST_GEE_KEY_PATH:-/etc/dokploy/data/etaseneu/gee-service-account-key.json}:/app/secrets/gee-service-account-key.json:ro
      - ${HOST_KLHK_BURNED_AREA_DIR:-/etc/dokploy/data/etaseneu/burned_area_klhk}:/app/burned_area_klhk:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Diisi dari environment stack Dokploy. Kosong = captcha non-aktif.
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - dokploy-network
    labels:
      traefik.docker.network: dokploy-network
      traefik.enable: "true"
      traefik.http.routers.etaseneu-web.entrypoints: web
      traefik.http.routers.etaseneu-web.middlewares: redirect-to-https@file
      traefik.http.routers.etaseneu-web.rule: Host(`etaseneu.ditpps.com`)
      traefik.http.routers.etaseneu-web.service: etaseneu-web
      traefik.http.routers.etaseneu-websecure.entrypoints: websecure
      traefik.http.routers.etaseneu-websecure.rule: Host(`etaseneu.ditpps.com`)
      traefik.http.routers.etaseneu-websecure.service: etaseneu-websecure
      traefik.http.routers.etaseneu-websecure.tls.certresolver: letsencrypt
      traefik.http.services.etaseneu-web.loadbalancer.server.port: "80"
      traefik.http.services.etaseneu-websecure.loadbalancer.server.port: "80"

networks:
  dokploy-network:
    external: true
