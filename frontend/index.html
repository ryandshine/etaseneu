<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1115" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ETA SENEU" />
    <title>ETA Seneu KPS</title>
    <!-- Widget verifikasi manusia di halaman login. Aktif hanya kalau
         VITE_TURNSTILE_SITE_KEY diisi saat build (lihat LoginPage.tsx). -->
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>
    <style>
      body {
        margin: 0;
        background-color: #140d08;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .view-loader--fullscreen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: radial-gradient(circle at 50% 38%, rgba(185, 34, 22, 0.22), rgba(20, 13, 8, 0.98) 72%), #140d08;
        color: #f3f4f6;
        box-sizing: border-box;
      }
      .view-loader-glow-backdrop {
        position: absolute;
        width: 360px;
        height: 360px;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(239, 68, 68, 0.25) 0%, rgba(249, 115, 22, 0.1) 45%, transparent 75%);
        filter: blur(48px);
        pointer-events: none;
        animation: loader-glow-pulse 3s ease-in-out infinite;
      }
      @keyframes loader-glow-pulse {
        0%, 100% { transform: scale(0.88); opacity: 0.55; }
        50% { transform: scale(1.18); opacity: 0.95; }
      }
      .view-loader-card {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 2.25rem 2rem;
        max-width: 360px;
        width: 100%;
        border-radius: 1.25rem;
        background: rgba(26, 17, 12, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-sizing: border-box;
      }
      .view-loader-emblem {
        position: relative;
        width: 4.75rem;
        height: 4.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.25rem;
      }
      .view-loader-pulse-ring {
        position: absolute;
        inset: -6px;
        border-radius: 9999px;
        border: 2px solid rgba(239, 68, 68, 0.7);
        animation: loader-pulse-ring 2.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      @keyframes loader-pulse-ring {
        0% { transform: scale(0.8); opacity: 0.95; }
        75%, 100% { transform: scale(1.5); opacity: 0; }
      }
      .view-loader-spin-ring {
        position: absolute;
        inset: -3px;
        border-radius: 9999px;
        border: 2px solid transparent;
        border-top-color: #f97316;
        border-right-color: #ef4444;
        animation: loader-spin 1.3s linear infinite;
      }
      @keyframes loader-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .view-loader-icon-wrap {
        position: relative;
        z-index: 1;
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 1rem;
        background: linear-gradient(135deg, #f97316 0%, #dc2626 55%, #991b1b 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 24px rgba(220, 38, 38, 0.5);
        animation: loader-flame-bounce 2s ease-in-out infinite;
      }
      @keyframes loader-flame-bounce {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-3px) scale(1.04); }
      }
      .view-loader-flame {
        color: #ffffff;
      }
      .view-loader-brand-text {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        margin-bottom: 1.5rem;
      }
      .view-loader-title {
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #fff6ee;
      }
      .view-loader-subtitle {
        font-size: 0.75rem;
        color: rgba(231, 230, 194, 0.7);
        letter-spacing: 0.03em;
      }
      .view-loader-status-block {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }
      .view-loader-label-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.15rem;
        color: #f3f4f6;
        font-size: 0.92rem;
        font-weight: 600;
      }
      .view-loader-sublabel {
        margin: 0;
        color: #9ca3af;
        font-size: 0.78rem;
        line-height: 1.35;
      }
      .view-loader-progress-track {
        width: 100%;
        max-width: 240px;
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
        position: relative;
        margin-top: 0.4rem;
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-sizing: border-box;
      }
      .view-loader-progress-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent 0%, #f97316 45%, #ef4444 75%, #dc2626 100%);
        box-shadow: 0 0 12px rgba(249, 115, 22, 0.7);
        animation: loader-indeterminate-bar 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes loader-indeterminate-bar {
        0% { left: -45%; width: 25%; }
        50% { left: 30%; width: 55%; }
        100% { left: 105%; width: 25%; }
      }
      .view-loader-dots {
        display: inline-flex;
        font-weight: 800;
      }
      .view-loader-dots .dot {
        opacity: 0.25;
        animation: loader-dot-blink 1.4s infinite;
      }
      .view-loader-dots .dot-1 { animation-delay: 0s; }
      .view-loader-dots .dot-2 { animation-delay: 0.22s; }
      .view-loader-dots .dot-3 { animation-delay: 0.44s; }
      @keyframes loader-dot-blink {
        0%, 20% { opacity: 0.25; transform: translateY(0); }
        50% { opacity: 1; color: #f97316; transform: translateY(-2px); }
        80%, 100% { opacity: 0.25; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="view-loader view-loader--fullscreen" role="status" aria-live="polite">
        <div class="view-loader-glow-backdrop" aria-hidden="true"></div>
        <div class="view-loader-card">
          <div class="view-loader-emblem">
            <span class="view-loader-pulse-ring" aria-hidden="true"></span>
            <span class="view-loader-spin-ring" aria-hidden="true"></span>
            <div class="view-loader-icon-wrap">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="view-loader-flame">
                <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
              </svg>
            </div>
          </div>
          <div class="view-loader-brand-text">
            <span class="view-loader-title">ETA SENEU</span>
            <span class="view-loader-subtitle">KPS Hotspot &amp; Karhutla Monitoring</span>
          </div>
          <div class="view-loader-status-block">
            <div class="view-loader-label-row">
              <span class="view-loader-label">Memuat Aplikasi</span>
              <span class="view-loader-dots" aria-hidden="true">
                <span class="dot dot-1">.</span>
                <span class="dot dot-2">.</span>
                <span class="dot dot-3">.</span>
              </span>
            </div>
            <p class="view-loader-sublabel">Mohon tunggu sebentar...</p>
            <div class="view-loader-progress-track" aria-hidden="true">
              <div class="view-loader-progress-bar"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
